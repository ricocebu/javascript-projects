<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <section class="container">
    <h1>BMI Calculator</h1>
    <form class="form">
      <label for="height">Height(cm): </label>
      <input id="height" type="number" placeholder="cm" required>
      <label for="height">Weight(kg): </label>
      <input id="weight" type="number" placeholder="kg" required>
      <div class="button-container">
        <input class="button" type="button" id="calculate" value="Calculate">
        <input class="button" type="reset" id="reset" value="Clear">
      </div>
      <br>
      <span id="result"></span>
      <span id="category"></span>
    </form>
  </section>
</body>
</html>
